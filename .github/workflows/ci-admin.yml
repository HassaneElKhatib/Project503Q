name: CI Admin

on:
  push:
    paths:
      - "shopcloud/services/admin/**"
      - "shopcloud/libs/**"
      - ".github/workflows/ci-admin.yml"
      - ".github/workflows/reusable-build-deploy.yml"
  pull_request:
    paths:
      - "shopcloud/services/admin/**"
      - "shopcloud/libs/**"
      - ".github/workflows/ci-admin.yml"
      - ".github/workflows/reusable-build-deploy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  admin:
    uses: ./.github/workflows/reusable-build-deploy.yml
    with:
      service: admin
      service_path: shopcloud/services/admin
      deploy: true
      eks_cluster_name: shopcloud-dev-eks
      k8s_namespace: app-dev
    secrets:
      aws_role_arn: ${{ secrets.AWS_OIDC_ROLE_ARN_DEV }}
