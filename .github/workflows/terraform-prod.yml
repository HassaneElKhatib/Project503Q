name: Terraform Prod

on:
  pull_request:
    branches: [main]
    paths:
      - "shopcloud/infra/envs/prod/**"
      - "policy/terraform/**"
      - ".github/workflows/terraform-prod.yml"
  push:
    branches: [main]
    paths:
      - "shopcloud/infra/envs/prod/**"
      - "policy/terraform/**"
      - ".github/workflows/terraform-prod.yml"
  workflow_dispatch: {}

env:
  TF_WORKING_DIR: ./shopcloud/infra/envs/prod
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION_PROD: eu-central-1
  AWS_ROLE_TO_ASSUME_PROD: arn:aws:iam::712044128773:role/shopcloud-prod-github-actions-prod
  CONFTEST_VERSION: "0.50.0"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION_PROD }}

      - name: Ensure GitHub Actions EKS access
        run: |
          set -euo pipefail
          policy_arn="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"

          if ! aws eks list-access-entries \
            --region eu-central-1 \
            --cluster-name shopcloud-prod-eks \
            --query "accessEntries[?@=='${AWS_ROLE_TO_ASSUME_PROD}'] | [0]" \
            --output text | grep -q "${AWS_ROLE_TO_ASSUME_PROD}"; then
            aws eks create-access-entry \
              --region eu-central-1 \
              --cluster-name shopcloud-prod-eks \
              --principal-arn "${AWS_ROLE_TO_ASSUME_PROD}" \
              --type STANDARD
          fi

          if ! aws eks list-associated-access-policies \
            --region eu-central-1 \
            --cluster-name shopcloud-prod-eks \
            --principal-arn "${AWS_ROLE_TO_ASSUME_PROD}" \
            --query "associatedAccessPolicies[?policyArn=='${policy_arn}'].policyArn | [0]" \
            --output text | grep -q "${policy_arn}"; then
            aws eks associate-access-policy \
              --region eu-central-1 \
              --cluster-name shopcloud-prod-eks \
              --principal-arn "${AWS_ROLE_TO_ASSUME_PROD}" \
              --policy-arn "${policy_arn}" \
              --access-scope type=cluster
          fi

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region eu-central-1 \
            --name shopcloud-prod-eks

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Generate prod CI tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          DOMAIN_NAME: ${{ vars.PROD_DOMAIN_NAME || 'www.welovedassouki.store' }}
          ORIGIN_DOMAIN_NAME: ${{ vars.PROD_ORIGIN_DOMAIN_NAME || 'k8s-shopcloudpublic-3976a6d8dc-1488320077.eu-central-1.elb.amazonaws.com' }}
          COOKIE_DOMAIN: ${{ vars.PROD_COOKIE_DOMAIN || '.www.welovedassouki.store' }}
          ADMIN_PRIVATE_DNS_RECORD_LABEL: ${{ vars.PROD_ADMIN_PRIVATE_DNS_RECORD_LABEL || 'priv-admin' }}
          CLIENT_VPN_CLIENT_CIDR: ${{ vars.PROD_CLIENT_VPN_CLIENT_CIDR || '10.222.0.0/22' }}
          KUBERNETES_VERSION: ${{ vars.PROD_KUBERNETES_VERSION || '1.30' }}
          NODE_INSTANCE_TYPES: ${{ vars.PROD_NODE_INSTANCE_TYPES || '["t3.micro"]' }}
          NODE_DESIRED_SIZE: ${{ vars.PROD_NODE_DESIRED_SIZE || '2' }}
          NODE_MIN_SIZE: ${{ vars.PROD_NODE_MIN_SIZE || '2' }}
          NODE_MAX_SIZE: ${{ vars.PROD_NODE_MAX_SIZE || '5' }}
          RDS_BACKUP_RETENTION_DAYS: ${{ vars.PROD_RDS_BACKUP_RETENTION_DAYS || '1' }}
          RDS_INSTANCE_CLASS: ${{ vars.PROD_RDS_INSTANCE_CLASS || 'db.t3.micro' }}
          RDS_REPLICA_INSTANCE_CLASS: ${{ vars.PROD_RDS_REPLICA_INSTANCE_CLASS || 'db.t3.micro' }}
          REPLICA_AWS_REGION: ${{ vars.PROD_REPLICA_AWS_REGION || 'eu-west-1' }}
          CLIENT_VPN_SERVER_CERTIFICATE_ARN: ${{ secrets.PROD_CLIENT_VPN_SERVER_CERTIFICATE_ARN }}
          CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN: ${{ secrets.PROD_CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN }}
          KMS_KEY_ARN: ${{ secrets.PROD_KMS_KEY_ARN }}
          REPLICA_VPC_ID: ${{ vars.PROD_REPLICA_VPC_ID }}
          REPLICA_PRIVATE_DATA_SUBNET_IDS: ${{ vars.PROD_REPLICA_PRIVATE_DATA_SUBNET_IDS }}
          REPLICA_KMS_KEY_ARN: ${{ vars.PROD_REPLICA_KMS_KEY_ARN }}
          SES_FROM_ADDRESS: ${{ vars.PROD_SES_FROM_ADDRESS || 'noreply@www.welovedassouki.store' }}
        run: |
          test -n "$CLIENT_VPN_SERVER_CERTIFICATE_ARN" || { echo "Missing PROD_CLIENT_VPN_SERVER_CERTIFICATE_ARN"; exit 1; }
          test -n "$CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN" || { echo "Missing PROD_CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN"; exit 1; }
          test -n "$KMS_KEY_ARN" || { echo "Missing PROD_KMS_KEY_ARN"; exit 1; }
          test -n "$REPLICA_VPC_ID" || { echo "Missing PROD_REPLICA_VPC_ID"; exit 1; }
          test -n "$REPLICA_PRIVATE_DATA_SUBNET_IDS" || { echo "Missing PROD_REPLICA_PRIVATE_DATA_SUBNET_IDS"; exit 1; }
          test -n "$REPLICA_KMS_KEY_ARN" || { echo "Missing PROD_REPLICA_KMS_KEY_ARN"; exit 1; }

          jq -n \
            --arg domain_name "$DOMAIN_NAME" \
            --arg origin_domain_name "$ORIGIN_DOMAIN_NAME" \
            --arg cookie_domain "$COOKIE_DOMAIN" \
            --arg admin_private_dns_record_label "$ADMIN_PRIVATE_DNS_RECORD_LABEL" \
            --arg client_vpn_client_cidr "$CLIENT_VPN_CLIENT_CIDR" \
            --arg kubernetes_version "$KUBERNETES_VERSION" \
            --argjson node_instance_types "$NODE_INSTANCE_TYPES" \
            --argjson node_desired_size "$NODE_DESIRED_SIZE" \
            --argjson node_min_size "$NODE_MIN_SIZE" \
            --argjson node_max_size "$NODE_MAX_SIZE" \
            --argjson rds_backup_retention_days "$RDS_BACKUP_RETENTION_DAYS" \
            --arg rds_instance_class "$RDS_INSTANCE_CLASS" \
            --arg rds_replica_instance_class "$RDS_REPLICA_INSTANCE_CLASS" \
            --arg replica_aws_region "$REPLICA_AWS_REGION" \
            --arg client_vpn_server_certificate_arn "$CLIENT_VPN_SERVER_CERTIFICATE_ARN" \
            --arg client_vpn_client_root_certificate_chain_arn "$CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN" \
            --arg kms_key_arn "$KMS_KEY_ARN" \
            --arg replica_vpc_id "$REPLICA_VPC_ID" \
            --argjson replica_private_data_subnet_ids "$REPLICA_PRIVATE_DATA_SUBNET_IDS" \
            --arg replica_kms_key_arn "$REPLICA_KMS_KEY_ARN" \
            --arg ses_from_address "$SES_FROM_ADDRESS" \
            '{
              environment: "prod",
              aws_region: "eu-central-1",

              enable_edge: true,
              enable_eks: true,
              enable_helm_addons: true,
              enable_cognito: true,
              enable_data: true,
              enable_private_admin_access: true,
              enable_client_vpn: true,

              domain_name: $domain_name,
              origin_domain_name: $origin_domain_name,
              cookie_domain: $cookie_domain,

              customer_callback_url: ("https://" + $domain_name + "/auth/callback"),
              customer_logout_url: ("https://" + $domain_name + "/"),

              admin_private_dns_record_label: $admin_private_dns_record_label,
              admin_callback_url: ("https://" + $admin_private_dns_record_label + "." + $domain_name + "/auth/admin/callback"),
              admin_logout_url: ("https://" + $admin_private_dns_record_label + "." + $domain_name + "/"),

              client_vpn_client_cidr: $client_vpn_client_cidr,
              client_vpn_server_certificate_arn: $client_vpn_server_certificate_arn,
              client_vpn_client_root_certificate_chain_arn: $client_vpn_client_root_certificate_chain_arn,

              kubernetes_version: $kubernetes_version,
              node_instance_types: $node_instance_types,
              node_desired_size: $node_desired_size,
              node_min_size: $node_min_size,
              node_max_size: $node_max_size,

              rds_backup_retention_days: $rds_backup_retention_days,
              rds_instance_class: $rds_instance_class,
              rds_replica_instance_class: $rds_replica_instance_class,

              kms_key_arn: $kms_key_arn,
              replica_aws_region: $replica_aws_region,
              replica_vpc_id: $replica_vpc_id,
              replica_private_data_subnet_ids: $replica_private_data_subnet_ids,
              replica_kms_key_arn: $replica_kms_key_arn,

              ses_from_address: $ses_from_address
            }' > prod.ci.auto.tfvars.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build invoice worker artifact
        working-directory: shopcloud/services/invoice-worker
        run: |
          bash build.sh

      - name: Verify invoice worker artifact
        run: test -f shopcloud/services/invoice-worker/dist/invoice-worker.zip

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init && tflint -f compact

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: false

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan -input=false -lock-timeout=5m

      - name: Generate plan JSON
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -json tfplan > tfplan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.json
          retention-days: 7
          if-no-files-found: error

      - name: Setup Conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${{ env.CONFTEST_VERSION }}/conftest_${{ env.CONFTEST_VERSION }}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Run Conftest policies
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          conftest test tfplan.json \
            --policy ${{ github.workspace }}/shopcloud/policy/terraform \
            --all-namespaces

      - name: Setup Infracost
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost estimate
        if: env.INFRACOST_API_KEY != ''
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          infracost breakdown \
            --path tfplan.json \
            --format json \
            --out-file infracost.json
          infracost output \
            --path infracost.json \
            --format github-comment \
            --out-file /tmp/infracost-comment.md

      - name: Post Infracost comment
        if: env.INFRACOST_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/infracost-comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.stdout }}`;
            const trimmed = plan.length > 60000
              ? plan.substring(0, 60000) + "\n...truncated..."
              : plan;
            const body = [
              "#### Terraform Plan (prod)",
              "",
              "```",
              trimmed,
              "```",
              "",
              `Triggered by @${{ github.actor }} on commit \`${{ github.sha }}\``
            ].join("\n");
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION_PROD }}

      - name: Ensure GitHub Actions EKS access
        run: |
          set -euo pipefail
          policy_arn="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"

          if ! aws eks list-access-entries \
            --region eu-central-1 \
            --cluster-name shopcloud-prod-eks \
            --query "accessEntries[?@=='${AWS_ROLE_TO_ASSUME_PROD}'] | [0]" \
            --output text | grep -q "${AWS_ROLE_TO_ASSUME_PROD}"; then
            aws eks create-access-entry \
              --region eu-central-1 \
              --cluster-name shopcloud-prod-eks \
              --principal-arn "${AWS_ROLE_TO_ASSUME_PROD}" \
              --type STANDARD
          fi

          if ! aws eks list-associated-access-policies \
            --region eu-central-1 \
            --cluster-name shopcloud-prod-eks \
            --principal-arn "${AWS_ROLE_TO_ASSUME_PROD}" \
            --query "associatedAccessPolicies[?policyArn=='${policy_arn}'].policyArn | [0]" \
            --output text | grep -q "${policy_arn}"; then
            aws eks associate-access-policy \
              --region eu-central-1 \
              --cluster-name shopcloud-prod-eks \
              --principal-arn "${AWS_ROLE_TO_ASSUME_PROD}" \
              --policy-arn "${policy_arn}" \
              --access-scope type=cluster
          fi

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region eu-central-1 \
            --name shopcloud-prod-eks

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Generate prod CI tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          DOMAIN_NAME: ${{ vars.PROD_DOMAIN_NAME || 'www.welovedassouki.store' }}
          ORIGIN_DOMAIN_NAME: ${{ vars.PROD_ORIGIN_DOMAIN_NAME || 'k8s-shopcloudpublic-3976a6d8dc-1488320077.eu-central-1.elb.amazonaws.com' }}
          COOKIE_DOMAIN: ${{ vars.PROD_COOKIE_DOMAIN || '.www.welovedassouki.store' }}
          ADMIN_PRIVATE_DNS_RECORD_LABEL: ${{ vars.PROD_ADMIN_PRIVATE_DNS_RECORD_LABEL || 'priv-admin' }}
          CLIENT_VPN_CLIENT_CIDR: ${{ vars.PROD_CLIENT_VPN_CLIENT_CIDR || '10.222.0.0/22' }}
          KUBERNETES_VERSION: ${{ vars.PROD_KUBERNETES_VERSION || '1.30' }}
          NODE_INSTANCE_TYPES: ${{ vars.PROD_NODE_INSTANCE_TYPES || '["t3.micro"]' }}
          NODE_DESIRED_SIZE: ${{ vars.PROD_NODE_DESIRED_SIZE || '2' }}
          NODE_MIN_SIZE: ${{ vars.PROD_NODE_MIN_SIZE || '2' }}
          NODE_MAX_SIZE: ${{ vars.PROD_NODE_MAX_SIZE || '5' }}
          RDS_BACKUP_RETENTION_DAYS: ${{ vars.PROD_RDS_BACKUP_RETENTION_DAYS || '1' }}
          RDS_INSTANCE_CLASS: ${{ vars.PROD_RDS_INSTANCE_CLASS || 'db.t3.micro' }}
          RDS_REPLICA_INSTANCE_CLASS: ${{ vars.PROD_RDS_REPLICA_INSTANCE_CLASS || 'db.t3.micro' }}
          REPLICA_AWS_REGION: ${{ vars.PROD_REPLICA_AWS_REGION || 'eu-west-1' }}
          CLIENT_VPN_SERVER_CERTIFICATE_ARN: ${{ secrets.PROD_CLIENT_VPN_SERVER_CERTIFICATE_ARN }}
          CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN: ${{ secrets.PROD_CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN }}
          KMS_KEY_ARN: ${{ secrets.PROD_KMS_KEY_ARN }}
          REPLICA_VPC_ID: ${{ vars.PROD_REPLICA_VPC_ID }}
          REPLICA_PRIVATE_DATA_SUBNET_IDS: ${{ vars.PROD_REPLICA_PRIVATE_DATA_SUBNET_IDS }}
          REPLICA_KMS_KEY_ARN: ${{ vars.PROD_REPLICA_KMS_KEY_ARN }}
          SES_FROM_ADDRESS: ${{ vars.PROD_SES_FROM_ADDRESS || 'noreply@www.welovedassouki.store' }}
        run: |
          test -n "$CLIENT_VPN_SERVER_CERTIFICATE_ARN" || { echo "Missing PROD_CLIENT_VPN_SERVER_CERTIFICATE_ARN"; exit 1; }
          test -n "$CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN" || { echo "Missing PROD_CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN"; exit 1; }
          test -n "$KMS_KEY_ARN" || { echo "Missing PROD_KMS_KEY_ARN"; exit 1; }
          test -n "$REPLICA_VPC_ID" || { echo "Missing PROD_REPLICA_VPC_ID"; exit 1; }
          test -n "$REPLICA_PRIVATE_DATA_SUBNET_IDS" || { echo "Missing PROD_REPLICA_PRIVATE_DATA_SUBNET_IDS"; exit 1; }
          test -n "$REPLICA_KMS_KEY_ARN" || { echo "Missing PROD_REPLICA_KMS_KEY_ARN"; exit 1; }

          jq -n \
            --arg domain_name "$DOMAIN_NAME" \
            --arg origin_domain_name "$ORIGIN_DOMAIN_NAME" \
            --arg cookie_domain "$COOKIE_DOMAIN" \
            --arg admin_private_dns_record_label "$ADMIN_PRIVATE_DNS_RECORD_LABEL" \
            --arg client_vpn_client_cidr "$CLIENT_VPN_CLIENT_CIDR" \
            --arg kubernetes_version "$KUBERNETES_VERSION" \
            --argjson node_instance_types "$NODE_INSTANCE_TYPES" \
            --argjson node_desired_size "$NODE_DESIRED_SIZE" \
            --argjson node_min_size "$NODE_MIN_SIZE" \
            --argjson node_max_size "$NODE_MAX_SIZE" \
            --argjson rds_backup_retention_days "$RDS_BACKUP_RETENTION_DAYS" \
            --arg rds_instance_class "$RDS_INSTANCE_CLASS" \
            --arg rds_replica_instance_class "$RDS_REPLICA_INSTANCE_CLASS" \
            --arg replica_aws_region "$REPLICA_AWS_REGION" \
            --arg client_vpn_server_certificate_arn "$CLIENT_VPN_SERVER_CERTIFICATE_ARN" \
            --arg client_vpn_client_root_certificate_chain_arn "$CLIENT_VPN_CLIENT_ROOT_CERTIFICATE_CHAIN_ARN" \
            --arg kms_key_arn "$KMS_KEY_ARN" \
            --arg replica_vpc_id "$REPLICA_VPC_ID" \
            --argjson replica_private_data_subnet_ids "$REPLICA_PRIVATE_DATA_SUBNET_IDS" \
            --arg replica_kms_key_arn "$REPLICA_KMS_KEY_ARN" \
            --arg ses_from_address "$SES_FROM_ADDRESS" \
            '{
              environment: "prod",
              aws_region: "eu-central-1",

              enable_edge: true,
              enable_eks: true,
              enable_helm_addons: true,
              enable_cognito: true,
              enable_data: true,
              enable_private_admin_access: true,
              enable_client_vpn: true,

              domain_name: $domain_name,
              origin_domain_name: $origin_domain_name,
              cookie_domain: $cookie_domain,

              customer_callback_url: ("https://" + $domain_name + "/auth/callback"),
              customer_logout_url: ("https://" + $domain_name + "/"),

              admin_private_dns_record_label: $admin_private_dns_record_label,
              admin_callback_url: ("https://" + $admin_private_dns_record_label + "." + $domain_name + "/auth/admin/callback"),
              admin_logout_url: ("https://" + $admin_private_dns_record_label + "." + $domain_name + "/"),

              client_vpn_client_cidr: $client_vpn_client_cidr,
              client_vpn_server_certificate_arn: $client_vpn_server_certificate_arn,
              client_vpn_client_root_certificate_chain_arn: $client_vpn_client_root_certificate_chain_arn,

              kubernetes_version: $kubernetes_version,
              node_instance_types: $node_instance_types,
              node_desired_size: $node_desired_size,
              node_min_size: $node_min_size,
              node_max_size: $node_max_size,

              rds_backup_retention_days: $rds_backup_retention_days,
              rds_instance_class: $rds_instance_class,
              rds_replica_instance_class: $rds_replica_instance_class,

              kms_key_arn: $kms_key_arn,
              replica_aws_region: $replica_aws_region,
              replica_vpc_id: $replica_vpc_id,
              replica_private_data_subnet_ids: $replica_private_data_subnet_ids,
              replica_kms_key_arn: $replica_kms_key_arn,

              ses_from_address: $ses_from_address
            }' > prod.ci.auto.tfvars.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build invoice worker artifact
        working-directory: shopcloud/services/invoice-worker
        run: |
          bash build.sh

      - name: Verify invoice worker artifact
        run: test -f shopcloud/services/invoice-worker/dist/invoice-worker.zip

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan -input=false -lock-timeout=5m

      - name: Generate plan JSON
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -json tfplan > tfplan.json

      - name: Setup Conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${{ env.CONFTEST_VERSION }}/conftest_${{ env.CONFTEST_VERSION }}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/conftest

      - name: Run Conftest policies
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          conftest test tfplan.json \
            --policy ${{ github.workspace }}/shopcloud/policy/terraform \
            --all-namespaces

      - name: Show apply warning
        run: |
          echo "This job is about to apply Terraform changes to PROD."
          echo "Only continue if the prod environment approval was intentional."

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false tfplan
