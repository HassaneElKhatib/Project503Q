name: Terraform Redis Module CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "shopcloud/infra/envs/dev/modules/redis/**"
      - "shopcloud/infra/envs/prod/modules/redis/**"
      - ".github/workflows/tf-redis-ci.yml"
      - ".github/workflows/_reusable-tf-module-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "shopcloud/infra/envs/dev/modules/redis/**"
      - "shopcloud/infra/envs/prod/modules/redis/**"
      - ".github/workflows/tf-redis-ci.yml"
      - ".github/workflows/_reusable-tf-module-ci.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-redis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_dev:
    uses: ./.github/workflows/_reusable-tf-module-ci.yml
    with:
      module_path: shopcloud/infra/envs/dev/modules/redis
      module_name: redis (dev)
  validate_prod:
    uses: ./.github/workflows/_reusable-tf-module-ci.yml
    with:
      module_path: shopcloud/infra/envs/prod/modules/redis
      module_name: redis (prod)


