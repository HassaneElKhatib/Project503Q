name: CI Invoice Worker

on:
  push:
    paths:
      - "shopcloud/services/invoice-worker/**"
      - ".github/workflows/ci-invoice-worker.yml"
  pull_request:
    paths:
      - "shopcloud/services/invoice-worker/**"
      - ".github/workflows/ci-invoice-worker.yml"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test invoice-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install -U pip
          python -m pip install -e "shopcloud/services/invoice-worker[dev]"

      - run: pytest shopcloud/services/invoice-worker/tests -q

  package:
    needs: [test]
    name: Build Lambda zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build artifact
        working-directory: shopcloud/services/invoice-worker
        run: |
          set -euxo pipefail
          python -m pip install -U pip wheel build
          python -m pip install -r <(python -c "import tomllib,sys; d=tomllib.load(open('pyproject.toml','rb')); print('\n'.join(d['project']['dependencies']))") -t package
          cp -r src package/
          (cd package && zip -r ../invoice-worker.zip .)
          mkdir -p dist && mv invoice-worker.zip dist/

      - uses: actions/upload-artifact@v4
        with:
          name: invoice-worker-zip
          path: shopcloud/services/invoice-worker/dist/invoice-worker.zip
          retention-days: 7


