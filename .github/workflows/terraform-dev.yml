name: Terraform Dev

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "shopcloud/infra/envs/dev/**"
      - "policy/terraform/**"
      - ".github/workflows/terraform-dev.yml"
  push:
    branches: [dev]
    paths:
      - "shopcloud/infra/envs/dev/**"
      - "policy/terraform/**"
      - ".github/workflows/terraform-dev.yml"

env:
  TF_WORKING_DIR: ./shopcloud/infra/envs/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION_DEV: eu-central-1
  AWS_ROLE_TO_ASSUME_DEV: ${{ vars.AWS_ROLE_DEV || 'arn:aws:iam::712044128773:role/shopcloud-dev-github-actions-dev' }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION_DEV }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init && tflint -f compact

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: false

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan -input=false

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION_DEV }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan -input=false

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

