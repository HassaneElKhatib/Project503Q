name: Reusable Terraform Module CI

on:
  workflow_call:
    inputs:
      module_path:
        description: "Path to the Terraform module to validate."
        required: true
        type: string
      module_name:
        description: "Human-readable module name for logs."
        required: false
        type: string
        default: "terraform module"
      terraform_version:
        description: "Terraform version to use."
        required: false
        type: string
        default: "1.7.5"

permissions:
  contents: read

jobs:
  terraform-module-ci:
    name: Validate ${{ inputs.module_name }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.module_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show module info
        run: |
          echo "Module name: ${{ inputs.module_name }}"
          echo "Module path: ${{ inputs.module_path }}"
          pwd
          ls -la

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Add dummy AWS providers for module validation
        run: |
          cat > zz_ci_providers.tf <<'EOF'
          provider "aws" {
            region                      = "us-east-1"
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }

          provider "aws" {
            alias                       = "replica"
            region                      = "eu-west-1"
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }
          EOF

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate