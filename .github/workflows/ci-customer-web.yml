name: CI Customer Web

on:
  push:
    paths:
      - "shopcloud/services/customer-web/**"
      - ".github/workflows/ci-customer-web.yml"
  pull_request:
    paths:
      - "shopcloud/services/customer-web/**"
      - ".github/workflows/ci-customer-web.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Lint & build customer-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopcloud/services/customer-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shopcloud/services/customer-web/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'http://api-gateway:8080' }}


