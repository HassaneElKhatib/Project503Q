apiVersion: v1
kind: Namespace
metadata:
  name: alb-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-dns-smoke
  namespace: alb-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alb-dns-smoke
  template:
    metadata:
      labels:
        app: alb-dns-smoke
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: alb-dns-smoke
  namespace: alb-smoke
spec:
  type: ClusterIP
  selector:
    app: alb-dns-smoke
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-dns-smoke
  namespace: alb-smoke
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alb-dns-smoke
                port:
                  number: 80
