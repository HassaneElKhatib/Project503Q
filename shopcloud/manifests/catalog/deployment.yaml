# Catalog deployment.
#
# In production, catalog reads from RDS (PRODUCTS_SOURCE=sql). The seed
# JSON in services/catalog/data/products.json is loaded into RDS by C's
# Alembic seed migration once.
#
# Catalog uses the READ endpoint of RDS - it never writes. This lets us
# scale reads onto a read replica without affecting checkout's write path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: app
  labels:
    app: catalog
    tier: backend
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        tier: backend
    spec:
      serviceAccountName: catalog
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: catalog
      containers:
        - name: catalog
          image: 712044128773.dkr.ecr.eu-central-1.amazonaws.com/shopcloud-prod-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: catalog
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-env
                  key: environment
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-env
                  key: aws_region
            - name: LOG_LEVEL
              value: INFO
            # Production: read from RDS (read endpoint - we never write)
            - name: PRODUCTS_SOURCE
              value: sql
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-database
                  key: reader_url
            - name: DB_POOL_SIZE
              value: "5"
            # ElastiCache Redis for cache-aside on GET /products/:id
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-redis
                  key: url
                  optional: true
            - name: CACHE_TTL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # /health/ready hits Postgres each probe; small RDS + pool exhausts under load.
              path: /health/live
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
