apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: app
  labels:
    app: catalog
spec:
  type: ClusterIP   # Internal only - public traffic comes via Ingress
  selector:
    app: catalog
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# IRSA-bound service account.
# B's terraform/modules/eks creates the IAM role and writes the role ARN
# into this annotation via a kustomize patch or helm value.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::712044128773:role/shopcloud-prod-eks-catalog-irsa
