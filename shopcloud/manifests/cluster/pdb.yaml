# PodDisruptionBudgets keep at least 1 pod alive during voluntary disruptions
# (node drains, cluster autoscaler scale-downs, rolling node replacements).
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-pdb
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: catalog
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-pdb
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cart-pdb
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cart
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin-pdb
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: admin
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-pdb
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: checkout
