# The "app" namespace holds all 5 microservices.
# Each cluster (dev cluster, prod cluster) has its own copy.
#
# Pod Security Standards = restricted: enforces non-root, no privileged,
# no host networking, drops capabilities. Anything that fails admission
# is rejected at apply time.
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    name: app
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
