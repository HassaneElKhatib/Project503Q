# NetworkPolicies for the app namespace.
# Default-deny ingress, then explicitly allow the traffic we expect.
# Requires a CNI that supports NetworkPolicy (Calico, or VPC CNI with Calico
# add-on). EKS clusters need this enabled at cluster setup.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-services
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [catalog, auth, cart, admin, checkout, api-gateway, customer-web]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.30.0.0/16
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
# Cart needs to call catalog. Checkout reads cart's Redis (no policy needed
# for outgoing). All cross-pod calls inside the namespace go through this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
