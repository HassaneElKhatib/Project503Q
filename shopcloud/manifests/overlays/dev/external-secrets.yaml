---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shared-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shopcloud-aws
    kind: ClusterSecretStore
  target:
    name: shared-database
    creationPolicy: Owner
  data:
    - secretKey: writer_url
      remoteRef:
        key: /shopcloud/dev/database/shared
        property: writer_url
    - secretKey: reader_url
      remoteRef:
        key: /shopcloud/dev/database/shared
        property: reader_url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shared-redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shopcloud-aws
    kind: ClusterSecretStore
  target:
    name: shared-redis
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: /shopcloud/dev/redis/shared
        property: redis_url
