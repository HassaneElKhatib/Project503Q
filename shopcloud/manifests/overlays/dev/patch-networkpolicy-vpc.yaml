# Dev VPC default CIDR from Terraform dev variables (10.20.0.0/16); prod NetworkPolicy uses 10.30.0.0/16.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-services
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
