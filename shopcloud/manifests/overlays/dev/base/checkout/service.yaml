apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: app
  labels:
    app: checkout
spec:
  type: ClusterIP
  selector:
    app: checkout
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::712044128773:role/shopcloud-dev-eks-checkout-irsa
