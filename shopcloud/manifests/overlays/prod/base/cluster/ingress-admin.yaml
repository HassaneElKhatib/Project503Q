apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # Regional ACM cert for priv-admin.www.welovedassouki.store (provisioned by infra/envs/prod/modules/admin_private_access).
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:712044128773:certificate/5a71e921-9925-486c-9114-cb4c4fc1f6e9
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/group.name: shopcloud-admin
    # VPC CIDR + Client VPN client CIDR (see infra envs/prod variables.tf and terraform.tfvars).
    alb.ingress.kubernetes.io/inbound-cidrs: 10.30.0.0/16,10.222.0.0/22
    alb.ingress.kubernetes.io/subnets: subnet-0e3a399645d66db95,subnet-0a9ee9478adf9adfe
spec:
  ingressClassName: alb
  rules:
    # Admin is reachable only at the private FQDN over HTTPS, from VPC + VPN client CIDRs.
    - host: priv-admin.www.welovedassouki.store
      http:
        paths:
          - path: /auth/admin
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-web
                port:
                  number: 80
