apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: PLACEHOLDER_ADMIN_ALB_CERT_ARN
    alb.ingress.kubernetes.io/healthcheck-path: /health/live
    alb.ingress.kubernetes.io/group.name: shopcloud-admin
    alb.ingress.kubernetes.io/inbound-cidrs: PLACEHOLDER_ADMIN_INGRESS_CIDR
spec:
  rules:
    - host: PLACEHOLDER_ADMIN_HOST   # e.g. admin.dev.internal.shopcloud.example
      http:
        paths:
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
          - path: /api/me
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 80
