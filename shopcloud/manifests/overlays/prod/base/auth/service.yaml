apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: app
  labels:
    app: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::712044128773:role/shopcloud-prod-eks-auth-irsa
