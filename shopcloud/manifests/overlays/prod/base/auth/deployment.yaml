apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: app
  labels:
    app: auth
    tier: backend
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        tier: backend
    spec:
      serviceAccountName: auth
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth
      containers:
        - name: auth
          image: 712044128773.dkr.ecr.eu-central-1.amazonaws.com/shopcloud-prod-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: auth
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-env
                  key: environment
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-env
                  key: aws_region
            - name: LOG_LEVEL
              value: INFO
            - name: COOKIE_SECURE
              value: "true"
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: user_pool_id
            - name: COGNITO_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: app_client_id
            - name: COGNITO_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: domain
            - name: COGNITO_REGION
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: region
            - name: CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: callback_url
            - name: LOGOUT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: logout_redirect_url
            - name: COOKIE_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: cookie_domain
            - name: STATE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: state_signing_key
            # Admin Cognito pool — gates /auth/admin/* router registration in app/main.py.
            - name: ADMIN_COOKIE_SECURE
              value: "true"
            - name: ADMIN_COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: user_pool_id
            - name: ADMIN_COGNITO_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: app_client_id
            - name: ADMIN_COGNITO_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: domain
            - name: ADMIN_COGNITO_REGION
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: region
            - name: ADMIN_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: callback_url
            - name: ADMIN_LOGOUT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: logout_redirect_url
            - name: ADMIN_COOKIE_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: cookie_domain
            - name: ADMIN_STATE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: state_signing_key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
