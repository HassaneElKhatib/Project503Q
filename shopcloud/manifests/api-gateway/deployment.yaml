apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: app
  labels:
    app: api-gateway
    tier: backend
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-gateway
      containers:
        - name: api-gateway
          image: 712044128773.dkr.ecr.eu-central-1.amazonaws.com/shopcloud-prod-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: api-gateway
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-env
                  key: environment
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-env
                  key: aws_region
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-env
                  key: public_origin
            - name: CATALOG_BASE_URL
              value: http://catalog
            - name: CART_BASE_URL
              value: http://cart
            - name: CHECKOUT_BASE_URL
              value: http://checkout
            - name: ADMIN_BASE_URL
              value: http://admin
            - name: AUTH_BASE_URL
              value: http://auth
            - name: USE_LOCAL_GATEWAY_AUTH
              value: "false"
            - name: GATEWAY_DB_URL
              valueFrom:
                secretKeyRef:
                  name: shared-database
                  key: writer_url
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: user_pool_id
            - name: COGNITO_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: app_client_id
            - name: COGNITO_REGION
              valueFrom:
                secretKeyRef:
                  name: cognito-customer
                  key: region
            - name: COGNITO_ADMIN_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: user_pool_id
            - name: COGNITO_ADMIN_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: app_client_id
            - name: COGNITO_ADMIN_REGION
              valueFrom:
                secretKeyRef:
                  name: cognito-admin
                  key: region
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-jwt
                  key: secret
            - name: SMTP_ENABLED
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_enabled
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_port
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_password
            - name: SMTP_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_from_email
            - name: SMTP_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_from_name
            - name: SMTP_USE_TLS
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_use_tls
            - name: SMTP_USE_SSL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-smtp
                  key: smtp_use_ssl
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
