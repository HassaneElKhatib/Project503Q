# ShopCloud manifests — select environment explicitly:
#
#   kubectl apply -k overlays/prod    # namespace app, prod Secrets paths, prod ECR images
#   kubectl apply -k overlays/dev     # namespace app-dev, /shopcloud/dev/* paths, dev ECR repos
#
# Do not mix overlays on one cluster without confirming VPC CIDR and DNS/TLS per overlay README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - overlays/prod
