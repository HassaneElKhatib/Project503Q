# DB migration Job (apply manually after images exist; not part of default kustomize apply).
#
#   kubectl delete job db-migrate -n app --ignore-not-found
#   kubectl apply -f manifests/migrations/job.yaml
#   kubectl wait --for=condition=complete job/db-migrate -n app --timeout=5m
#
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: app
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: db-migrate
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: 712044128773.dkr.ecr.eu-central-1.amazonaws.com/shopcloud-prod-checkout:latest
          command: ["sh", "-c"]
          args:
            - |
              cd /app && \
              python -c "import alembic; print('alembic available')" && \
              alembic upgrade head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-database
                  key: writer_url
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-env
                  key: aws_region
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
