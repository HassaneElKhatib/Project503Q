[project]
name = "shopcloud-invoice-worker"
version = "0.1.0"
description = "Lambda - SQS to PDF to S3 to SES"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0,<5.0",
    "boto3>=1.34,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto>=4.2,<5.0",
    "pypdf>=4.2",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
